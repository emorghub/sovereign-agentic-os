      repository: ghcr.io/jashwanthv07/sovereign-os/dagster
  dagsterDaemon:
    image:
      repository: ghcr.io/jashwanthv07/sovereign-os/dagster
  dagster-user-deployments:
    deployments:
    - name: example-user-code
      annotations:
        argocd.argoproj.io/sync-wave: '2'
      image:
        repository: ghcr.io/jashwanthv07/sovereign-os/dagster
        tag: 0.2.0
        pullPolicy: IfNotPresent
      dagsterApiGrpcArgs:
      - --python-file
      - /opt/dagster/app/repo.py
      port: 3030
      env:
      - name: TRINO_HOST
        value: trino
      - name: TRINO_PORT
        value: '8080'
      - name: TRINO_USER
        value: dbt-sales
      - name: TRINO_CATALOG
        value: iceberg
      - name: TRINO_SCHEMA
        value: sales
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
        limits:
          cpu: '1'
          memory: 1Gi
