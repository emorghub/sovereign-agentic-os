#
# CI — runs on pull requests targeting `main` and on pushes to `main`. The job ids
# `build` / `helm-lint` / `secret-scan` are STABLE and wired as required status checks
# in the branch ruleset; `test` / `typecheck` / `lint` join them (issue #31).
# Actions are pinned to commit SHAs — every SHA below has been verified to resolve.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # os-ui unit tests. Node 22.18+ is required: the suite is .ts run directly under
  # `node --test`, which needs native type-stripping (22.6+, unflagged 22.18+) and
  # glob support for --test (21+). Node 20 fails both.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Test (os-ui)
        run: npm --prefix os-ui test

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Typecheck (os-ui)
        run: npx --prefix os-ui tsc --noEmit -p os-ui/tsconfig.json

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Lint (os-ui)
        run: npm --prefix os-ui run lint

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Build (os-ui)
        run: npm --prefix os-ui run build
      - name: License gate (os-ui)
        run: npm --prefix os-ui run check:licenses

  # Python images. Paths are the pre-#39 layout; #39 moves them under images/base/
  # and images/extensions/ — whichever merges second rebases these three lines.
  py:
    name: py
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install "pytest>=8.0,<9"
      # data-runner's test imports app.py, which imports pyarrow/pyiceberg/boto3 — install
      # the image's own requirements first. The other three suites are stdlib-only.
      - name: pytest (data-runner)
        run: |
          pip install -r images/data-runner/requirements.txt
          python3 -m pytest -q images/data-runner/test_app.py
      - name: pytest (web-fetch)
        run: python3 -m pytest -q images/web-fetch/test_app.py
      - name: pytest (agent-runtime)
        run: python3 -m pytest -q images/agent-runtime/tests/
      - name: unittest (query-tool execute guard)
        run: python3 images/query-tool/test_execute_guard.py

  # OPA policy unit tests. Wrapped in a script because one of the four policies
  # (package agentic.authz) is inline in the OPA ConfigMap template, not a .rego file
  # — a bare `opa test policies/ tests/policies/` cannot see it.
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: latest
      - name: Policy tests
        run: bash scripts/policy-test.sh

  helm-lint:
    name: helm-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: Resolve chart dependencies
        run: |
          helm dependency build charts/sovereign-agentic-os \
            || helm dependency update charts/sovereign-agentic-os
      - name: Helm lint
        run: helm lint charts/sovereign-agentic-os

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
